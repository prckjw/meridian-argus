<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeridianArgus Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #262b36;
    --text: #e8eaed;
    --text-dim: #8b93a3;
    --accent: #6ea8fe;
    --good: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 24px 64px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 .dot { color: var(--accent); }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .controls { display: flex; align-items: center; gap: 10px; }
  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .refresh-note { font-size: 12px; color: var(--text-dim); }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .card .label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .card .value {
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .card .value.cost { color: var(--accent); }
  .card .value.err { color: var(--bad); }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
  }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-border);
    font-weight: 500;
  }
  tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-border);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  .provider-model { display: flex; flex-direction: column; gap: 2px; }
  .provider-model .provider { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  .provider-model .model { font-weight: 500; }
  .num { text-align: right; }
  .cost-unknown { color: var(--warn); font-size: 12px; }
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }
  footer {
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }
  footer a { color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Meridian<span class="dot">Argus</span> Dashboard</h1>
      <div class="subtitle">LLM usage &amp; cost, read from a local SQLite database</div>
    </div>
    <div class="controls">
      <select id="windowSelect">
        <option value="1">Last hour</option>
        <option value="24" selected>Last 24 hours</option>
        <option value="168">Last 7 days</option>
        <option value="720">Last 30 days</option>
      </select>
      <span class="refresh-note" id="refreshNote">refreshing every 30s</span>
    </div>
  </header>

  <div class="cards">
    <div class="card">
      <div class="label">Total estimated cost</div>
      <div class="value cost" id="totalCost">—</div>
    </div>
    <div class="card">
      <div class="label">Total calls</div>
      <div class="value" id="totalCalls">—</div>
    </div>
    <div class="card">
      <div class="label">Errors</div>
      <div class="value err" id="totalErrors">—</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Provider / Model</th>
        <th class="num">Calls</th>
        <th class="num">Errors</th>
        <th class="num">Tokens</th>
        <th class="num">Est. Cost</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="5" class="empty-state">Loading…</td></tr>
    </tbody>
  </table>

  <footer>
    Data from <code>meridian-argus-metrics-sqlite</code>. See
    <a href="https://github.com/prckjw/meridian-argus" target="_blank" rel="noopener">github.com/prckjw/meridian-argus</a>.
  </footer>
</div>

<script>
(function () {
  const windowSelect = document.getElementById('windowSelect');
  const totalCostEl = document.getElementById('totalCost');
  const totalCallsEl = document.getElementById('totalCalls');
  const totalErrorsEl = document.getElementById('totalErrors');
  const tableBody = document.getElementById('tableBody');
  const refreshNote = document.getElementById('refreshNote');

  const usdFormatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 4 });
  const intFormatter = new Intl.NumberFormat('en-US');

  let refreshTimer = null;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderRows(rows) {
    if (!rows.length) {
      tableBody.innerHTML = '<tr><td colspan="5" class="empty-state">No calls recorded in this window.</td></tr>';
      return;
    }
    tableBody.innerHTML = rows.map(function (r) {
      const costCell = r.costKnown
        ? usdFormatter.format(r.totalCostUsd)
        : '<span class="cost-unknown">unpriced</span>';
      return '<tr>' +
        '<td><div class="provider-model"><span class="provider">' + escapeHtml(r.provider) + '</span>' +
        '<span class="model">' + escapeHtml(r.model) + '</span></div></td>' +
        '<td class="num">' + intFormatter.format(r.callCount) + '</td>' +
        '<td class="num">' + intFormatter.format(r.errorCount) + '</td>' +
        '<td class="num">' + intFormatter.format(r.totalTokens) + '</td>' +
        '<td class="num">' + costCell + '</td>' +
        '</tr>';
    }).join('');
  }

  function load() {
    const hours = windowSelect.value;
    fetch('/meridian-argus/dashboard/api/summary?windowHours=' + encodeURIComponent(hours))
      .then(function (res) {
        if (!res.ok) { throw new Error('HTTP ' + res.status); }
        return res.json();
      })
      .then(function (data) {
        totalCostEl.textContent = usdFormatter.format(data.totalCostUsd || 0);
        totalCallsEl.textContent = intFormatter.format(data.totalCalls || 0);
        totalErrorsEl.textContent = intFormatter.format(data.totalErrors || 0);
        renderRows(data.byProviderModel || []);
        refreshNote.textContent = 'updated ' + new Date().toLocaleTimeString() + ' · refreshing every 30s';
      })
      .catch(function (err) {
        refreshNote.textContent = 'failed to refresh: ' + err.message;
      });
  }

  function scheduleRefresh() {
    if (refreshTimer) { clearInterval(refreshTimer); }
    refreshTimer = setInterval(load, 30000);
  }

  windowSelect.addEventListener('change', load);
  load();
  scheduleRefresh();
})();
</script>
</body>
</html>
