# MeridianArgus default pricing table
#
# Prices are USD per 1,000 tokens, as published by each provider.
# This file is the single source of truth and is copied verbatim into
# meridian-argus-core/src/main/resources/default-pricing.yaml at build time
# (see the resources plugin config in meridian-argus-core/pom.xml).
#
# Contributions welcome: prices drift often, PRs updating this file are one
# of the easiest ways to contribute to the project. Please cite the source
# page in your PR description.
#
# Last verified: 2026-07 (prices approximate, verify against provider
# pricing pages before relying on them for financial decisions).

